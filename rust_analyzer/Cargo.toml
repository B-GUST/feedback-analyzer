[package]
name = "rust_analyzer"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_analyzer"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }
ed25519-dalek = "2.2"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
rand_core = "0.6"
rand = "0.8"
hex = "0.4"
thiserror = "2"
whatlang = "0.16"
unicode-segmentation = "1.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
