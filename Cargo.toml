[package]
name = "feedback-analyzer"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_analyzer"
crate-type = ["cdylib"]

[[bin]]
name = "train_sentiment"
path = "src/bin/train_sentiment.rs"

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }
ed25519-dalek = "2.2"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
rand_core = "0.6"
rand = "0.8"
hex = "0.4"
thiserror = "2"
whatlang = "0.16"
unicode-segmentation = "1.12"

# Candle for ML inference
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
tokenizers = "0.21"
hf-hub = "0.4"

# For training and export
safetensors = "0.4"
candle-datasets = "0.9"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
